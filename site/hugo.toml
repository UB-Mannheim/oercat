# Hugo configuration. Data comes from data/oers.json + data/vocab.json,
# generated by `uv run oercat build-data`.
baseURL = "/"
defaultContentLanguage = "de"
defaultContentLanguageInSubdir = true
disableKinds = ["taxonomy", "term", "rss", "sitemap", "robotsTXT", "404"]
enableRobotsTXT = false

[languages.de]
  weight = 1
  label = "Deutsch"
  title = "OER-Katalog AI & Data Literacy"
[languages.en]
  weight = 2
  label = "English"
  title = "OER Catalogue AI & Data Literacy"

# The search page also emits /<lang>/index.json, the client-side search index.
[outputs]
  home = ["html", "json"]
  section = ["html"]
  page = ["html"]

# One content adapter (content-shared/oer/_content.gotmpl) creates the
# detail pages for every language.
[[module.mounts]]
  source = "content-shared"
  target = "content"
  [module.mounts.sites.matrix]
    languages = ["**"]

[markup.goldmark.renderer]
  unsafe = false
