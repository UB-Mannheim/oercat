{{ $stats := hugo.Data.vocab.stats }}
<footer class="site-footer">
  <div class="container site-footer-inner">
    <div class="footer-text">
      <p>{{ i18n "footer_data" | markdownify }}</p>
      <p>{{ i18n "stats_updated" }}: {{ time.Format ":date_medium" $stats.updated }}</p>
    </div>
    {{ with resources.Get "img/csm_Logo_Stiftung_Hochschullehre_pos-Gefoerdert-durch_093bad8e25.jpg" }}
    <a class="footer-logo" href="https://stiftung-hochschullehre.de" target="_blank" rel="noopener">
      <img src="{{ .RelPermalink }}" width="{{ .Width }}" height="{{ .Height }}" alt="Gefördert durch die Stiftung Innovation in der Hochschullehre">
    </a>
    {{ end }}
  </div>
</footer>
